# Lab audit only. Does not deploy the honeypot, bind a public port, or call out
# from the gateway. The analyzer smoke reads an archived log and writes files.
name: ATLAS agent audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  agent-gateway:
    name: agent-gateway
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agent-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Suite (ATLAS falsification + Hypothesis)
        run: |
          . .venv/bin/activate
          python - <<'PY'
          import re, subprocess, sys
          out = subprocess.check_output([sys.executable, "-m", "pytest", "--collect-only", "-q"], text=True)
          match = re.search(r"(\d+) tests collected", out)
          if not match:
              sys.stderr.write(out)
              sys.exit("could not count agent-gateway tests")
          n = int(match.group(1))
          # Floor against silently losing tests (the suite collects about 350).
          # Raise it when the suite grows; pytest below still fails the job on any failure.
          if n < 345:
              sys.exit(f"expected at least 345 agent-gateway tests, collected {n}")
          print(f"collected {n} agent-gateway tests")
          PY
          python -m pytest -q --tb=short
          python -m pytest tests/test_pep_falsification.py -q --tb=short

  agent-watch:
    name: agent-watch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: agent-watch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pytest -q --tb=line

  rogue-ai-pipeline:
    name: rogue-ai-pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: rogue-ai-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pytest -q --tb=line

  agentwatch-analyzer:
    name: agentwatch-analyzer smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r agentwatch-analyzer/requirements.txt
          python -m pip install -e agentwatch-analyzer
          python -m pip install -e agent-gateway
      - name: Unit tests
        working-directory: agentwatch-analyzer
        run: |
          . "$GITHUB_WORKSPACE/.venv/bin/activate"
          python -m pytest -q --tb=short
      - name: Smoke archived Tier-2 log
        run: |
          . .venv/bin/activate
          python agentwatch-analyzer/scripts/ci_smoke.py --out-dir analyzer-smoke
      - name: Executive audit report
        run: |
          . .venv/bin/activate
          # The gateway refuses to run without an explicit key (at least 32 bytes). Per-run random key.
          export AGENT_GATEWAY_HMAC_KEY="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          python -m agent_gateway audit analyzer-smoke --out-dir analyzer-smoke/audit-report --sarif findings.sarif
          test -s analyzer-smoke/audit-report/audit-report.html
          test -s analyzer-smoke/audit-report/audit-report.pdf
          test -s analyzer-smoke/audit-report/findings.sarif
          python -m agent_gateway verify analyzer-smoke/audit-report
      - name: Upload findings, replay, STIX bundle, SARIF, and executive report
        uses: actions/upload-artifact@v4
        with:
          name: agentwatch-analyzer-smoke
          if-no-files-found: error
          path: |
            analyzer-smoke/findings.json
            analyzer-smoke/replay.html
            analyzer-smoke/stix-bundle.json
            analyzer-smoke/stix-validation.json
            analyzer-smoke/audit-report/audit-report.html
            analyzer-smoke/audit-report/audit-report.pdf
            analyzer-smoke/audit-report/audit_manifest.json
            analyzer-smoke/audit-report/findings.sarif
