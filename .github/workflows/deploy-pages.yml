# Publishes the self-contained static site in site/ to GitHub Pages.
# Public, zero-auth-wall: served at https://freeling10-prog.github.io/rogue-ai-detection/
# Deploys on push to main (only when site/ or this workflow changes), and on manual dispatch.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One live deploy at a time; let an in-progress run finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stamp asset versions (cache-bust styles.css / app.js on every deploy)
        run: sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" site/index.html
      - name: Upload site/ artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
