[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-gateway"
version = "1.0.0"
description = "AgentGate loopback policy gateway (pep.py, agw1. capabilities) and offline executive audit CLI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "freeling10-prog"}]
keywords = ["agent", "security", "mitre-atlas"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = ["flask==3.1.3"]

[project.optional-dependencies]
test = ["pytest>=8.0", "hypothesis==6.170.9"]

[project.scripts]
agent-gateway = "agent_gateway.cli:main"

[tool.setuptools.packages.find]
include = ["agent_gateway*"]

[tool.setuptools.package-data]
agent_gateway = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
