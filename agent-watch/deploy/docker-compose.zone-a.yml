# Zone A: isolated, internet-facing honeypot.  Synthetic content only; no real data, credentials or
# secrets may ever be mounted into these containers.
#
#   docker compose -f deploy/docker-compose.zone-a.yml up --build
#
# nginx is published on 127.0.0.1 only (see AGENT_WATCH_PUBLISH below).  The honeypot container has
# no route to anything but nginx: its only network is `internal: true`.
name: agent-watch-zone-a

services:
  agentwatch:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: agent-watch:zone-a
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128
    restart: unless-stopped
    environment:
      # 0.0.0.0 is bound ONLY inside the container, reachable only over the internal network below.
      # AGENT_WATCH_ALLOW_NONLOCAL=1 is the explicit opt-in that satisfies agent-watch's non-loopback guard.
      AGENT_WATCH_BIND: "0.0.0.0:8000"
      AGENT_WATCH_ALLOW_NONLOCAL: "1"
      AGENT_WATCH_BEHIND_PROXY: "1"        # trust exactly one proxy hop (nginx overwrites X-Forwarded-For)
      AGENT_WATCH_TARPIT_S: "0"            # tarpit off by default; delays are hard-capped at 10 s anyway
    volumes:
      - leads:/data                        # leads JSONL, sqlite state, registry, salt/seed files (0600)
    expose: ["8000"]
    networks: [internal]

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 128
    restart: unless-stopped
    depends_on: [agentwatch]
    ports:
      # Host side defaults to loopback.  To expose it, set AGENT_WATCH_PUBLISH=0.0.0.0 - ONLY on a
      # dedicated, isolated host (see README, "Zone A / Zone B").
      - "${AGENT_WATCH_PUBLISH:-127.0.0.1}:${AGENT_WATCH_PORT:-8080}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-logs:/var/log/nginx          # JSON access log (privacy-mapped); ship read-only to Zone B
    networks: [edge, internal]

networks:
  internal:
    internal: true                         # no egress, not reachable from the host or other stacks
  edge: {}                                 # nginx's published side

volumes:
  leads: {}
  nginx-logs: {}
