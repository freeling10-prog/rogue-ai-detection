# nginx in front of agent-watch (Zone A).  Intended for nginxinc/nginx-unprivileged (listens on 8080).
# It writes a JSON access log that agent-watch's JSON gateway parser reads directly:
#     python -m agentwatch analyze <nginx json log> --leads <leads.jsonl>
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
    server_tokens off;
    # read-only root filesystem: every temp path goes to the tmpfs
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # request-size / slowloris limits (the app enforces the same 16 KiB body cap with a JSON 413)
    client_max_body_size        16k;
    client_body_buffer_size     16k;
    large_client_header_buffers 4 8k;
    client_header_timeout       10s;
    client_body_timeout         10s;
    send_timeout                15s;
    keepalive_timeout           15s;

    # ---- privacy: never write secret-looking values into the raw nginx log ---------------------------
    # agent-watch scrubs everything it writes itself, but this log is written by nginx, so the query
    # string, User-Agent and Referer are replaced when they look like API keys / tokens / emails.
    # (Authorization and Cookie headers are not part of the log format at all.)
    # RESIDUAL RISK: nginx's own error_log may still quote a request line on protocol errors; it goes to
    # stderr, not to the volume - keep container logs short-lived or scrubbed too.
    map "$args $http_user_agent $http_referer" $aw_has_secret {
        default 0;
        "~*(sk-[A-Za-z0-9_-]{16,}|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{4,}|bearer[ +%20]+[A-Za-z0-9._-]{8,}|[A-Za-z0-9._%+-]+(@|%40)[A-Za-z0-9.-]+\.[A-Za-z]{2,})" 1;
    }
    map $aw_has_secret $aw_args { 0 $args;            1 "[REDACTED_SECRET_LIKE]"; }
    map $aw_has_secret $aw_ua   { 0 $http_user_agent; 1 "[REDACTED_SECRET_LIKE]"; }
    map $aw_has_secret $aw_ref  { 0 $http_referer;    1 "[REDACTED_SECRET_LIKE]"; }
    map $uri $aw_path {
        default $uri;
        "~*(sk-[A-Za-z0-9_-]{16,}|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{4,})" "[REDACTED_SECRET_LIKE_PATH]";
    }

    # JSON access log = agent-watch's JSON gateway format (keys timestamp, client_ip, method, path, query,
    # status, bytes, request_time, user_agent, referer).  $remote_addr is the real peer (this nginx is the
    # edge); the app sees it through X-Forwarded-For below.
    log_format agentwatch_json escape=json
        '{"timestamp":"$time_iso8601","client_ip":"$remote_addr","method":"$request_method",'
        '"path":"$aw_path","query":"$aw_args","status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time,"user_agent":"$aw_ua","referer":"$aw_ref"}';
    access_log /var/log/nginx/agentwatch.json.log agentwatch_json;

    # Safety ceiling only: deliberately far above what an agent doing a burst of requests produces so that
    # the app's own 429 traps (which carry the diagnostic/peer breadcrumbs) are what clients normally see.
    limit_req_zone $binary_remote_addr zone=aw_ceiling:10m rate=100r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=aw_conn:10m;

    upstream agentwatch_app {
        server agentwatch:8000;
        keepalive 8;
    }

    server {
        listen 8080 default_server;
        server_name _;

        limit_req  zone=aw_ceiling burst=400 nodelay;
        limit_conn aw_conn 50;

        location / {
            proxy_pass http://agentwatch_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # tarpit delays and responses are passed straight through
            proxy_buffering         off;
            # whole request body is read by nginx first (slow-body clients never tie up an app thread)
            proxy_request_buffering on;
            proxy_connect_timeout 3s;
            proxy_read_timeout    15s;
            proxy_send_timeout    10s;
            # OVERWRITE (not append) so a client-supplied X-Forwarded-For can never reach the app:
            # the app trusts exactly one hop (ProxyFix x_for=1) and this is that hop.
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         "";
        }
    }
}
