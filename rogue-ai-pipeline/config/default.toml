# Default thresholds. Every value here can be overridden; unknown keys are rejected (strict validation).
# The HMAC key is NEVER stored here - only the name of the environment variable that holds it.

[pseudonymization]
key_env = "ROGUE_PIPELINE_HMAC_KEY"
min_key_bytes = 16
digest_hex_len = 16

[normalization]
require_synthetic = true      # refuse events not labeled synthetic=true (this build is synthetic-data only)
max_text_len = 2000
shingle_size = 3
scrub_raw_fields = true       # v4: keyed encoded-secret scrubber (%40, %2540, \\uXXXX, newline/CR/TAB-split tokens) on resource/text/tokens BEFORE hashing

[tools]
write_tools = ["send_email", "http_post", "upload_file", "write_file", "post_webhook"]

[layer1]
n_estimators = 300
random_state = 0
flag_threshold = 0.5
top_k_explanations = 3

[layer2]
baseline_min_events = 20
baseline_min_seconds = 3600.0
untrusted_window_s = 300.0
immediate_window_s = 60.0
min_exfil_bytes = 1000
access_min_denied = 10
access_min_denied_ratio = 0.2
access_min_sensitive = 5

[layer3]
window_s = 15.0
min_neg_log10_p = 8.0
min_shared_windows = 4
max_df_frac = 0.15
min_cosine = 0.5
weight_timing = 0.5
weight_state = 0.6            # shared semantic state across IPs/sessions (needs >= min_state_tokens distinct tokens)
min_state_tokens = 3
weight_redacted = 0.6         # same agent-watch redaction marker in two sessions: moderate confidence, subject to suppression
redacted_max_sessions = 6     # markers seen in more sessions than this are 'popular' and ignored
weight_content = 0.5
edge_threshold = 0.55         # above either single-signal maximum (0.5) => timing AND content are both required
min_cluster_size = 2
split_below_density = 0.7     # components less dense than this are split into communities (Louvain)
suppress_declared_groups = true
suppress_periodic = true
suppress_fanout = true

[fusion]
w_anomaly = 0.5               # must stay below lead_threshold: anomaly score alone can never create a lead
w_rules = 0.9
w_sequence = 0.5            # applies only when the sequence gate passes; must ALSO stay below lead_threshold (validated)
w_graph = 0.8
lead_threshold = 0.55
# v4 two-signal corroboration gate: a lead needs a floor (R10/R11), or >= 2 independent families (statistical = IF + sequence counted ONCE,
# rule gate, coordination graph), or one deterministic family that is strong alone (rule >= rule_solo_min, cluster >= graph_solo_min).
corroboration_gate = true
anomaly_min = 0.3             # an Isolation Forest score below this is not a family
rule_solo_min = 0.65          # >1 (e.g. 1.01) removes the solo-rule exception
graph_solo_min = 0.8          # >1 removes the solo-cluster exception ("strict" gate: costs most recall, see README)

[frozen]                      # frozen baseline (train-baseline / detect --baseline)
n_folds = 5
min_reference_agents = 30
min_session_events = 8        # fewer events => "insufficient evidence", never a guess

[sequence]                    # Markov action-order model (timing-independent), a fusion gate
enabled = true
gate = 0.6
window = 30
min_transitions = 20

[identity]                    # simulated HTTP Message Signatures + network allowlists, applied BEFORE scoring
enabled = true
max_skew_s = 300.0
# [[identity.ip_allowlist]]
# cidr = "203.0.113.0/24"; label = "partner-egress"; exempt_rules = ["R3", "R4"]; allow_dest_suffixes = [".partner.example"]

[web]                         # v3: web-collector evidence, commodity-scanner pre-filter, score floors (only events with a `web` block)
enabled = true
prefilter = true              # set commodity scanners (php/wp/.env/phpmyadmin paths, zgrab/masscan/censys/shodan/nmap UAs) aside BEFORE scoring and baseline training
scanner_path_min_share = 0.8  # share of a client's requests that must be scanner paths
asset_starvation_min_pages = 5
unlinked_min_never_offered = 2
floors_enabled = true
floor_weak = 0.58             # a single hidden-link / decoy contact: reaches the review queue, below review_first (0.75)
floor_strong = 0.8            # used what a decoy offered (schema param, MCP tools/call, canary, error-hint follow)
# --- v4: R8 revision, R11 (beacon / ARIA / browser-agent inconsistency), R9 link-graph fallback ---
core_asset_kinds = ["css", "js"]   # R8: a client that loaded any of these rendered the page; skipping IMAGES is never starvation
beacon_min_navs = 3                # R11: click-through page loads (Referer present) before "no beacon" means anything
strength_browser_inconsistency = 0.55
link_graph_fallback = true         # R9 when the log has no offered-links record: infer the allowed link graph from Referer transitions
link_min_support = 2               # other clients that must have taken a transition (leave-one-out)
link_fallback_min_jumps = 4
link_fallback_strength = 0.5
# scanner_ua_patterns / scanner_path_patterns / declared_bot_ua_patterns / browser_ua_patterns: lists of regexes (see config.py defaults)
# --- v6: R11 tiers (beacon_forged / script_fetched_but_unexecuted / vlm / inversion), R9 missing cursor, R14 parasitic fork ---
nav_coherent_share = 0.8           # R11: a missing beacon is IGNORED when js_assets_fetched == 0 or >= this share of navigations has coherent headers
vlm_min_beacons = 2
missing_cursor_min = 2
r14_enabled = true
r14_window_s = 0.5                 # a fork = a suspicious request within 500 ms of a human-branch page load on an unrelated path
r14_min_forks = 2

[probing]                     # v6 R13 slow_or_shielded_probing - calibrated on BENIGN reference data only (scripts/calibrate_r13.py)
enabled = true
min_events = 12
min_probes = 3
p0 = 0.05                     # benign 99th-percentile per-session probe rate (0.0476), rounded up
p1 = 0.15
p1_low = 0.1                  # small-shift CUSUM (padded probers just above the benign tail)
cusum_h_low = 2.6             # benign max 2.01 x 1.25 = 2.51, rounded up
paced_rate_min = 0.05
cusum_h = 4.0                 # benign max CUSUM 2.87 x 1.25 = 3.59, rounded up
w3_min = 3                    # benign max 2 + 1 (4 = disabled)
w7_min = 3                    # benign max 2 + 1 (8 = disabled)
collapse_max_logstd = 0.6     # half of the benign 1% quantile (1.20) of per-session max sub-window log-gap std
